name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - ai-devops-incident-agent
          - kubernetes-sre-lab
          - aws-encrypted-backup-lab
          - releaseguard
          - rotation-rehearsal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            projects/ai-devops-incident-agent/requirements*.txt
            projects/aws-encrypted-backup-lab/requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          set -eu
          dir="projects/${{ matrix.project }}"
          if [ -f "$dir/requirements-dev.txt" ]; then
            python -m pip install -r "$dir/requirements-dev.txt"
          elif [ -f "$dir/requirements.txt" ]; then
            python -m pip install -r "$dir/requirements.txt"
          fi
      - name: Run tests
        shell: bash
        run: |
          set -eu
          cd "projects/${{ matrix.project }}"
          if [ "${{ matrix.project }}" = "ai-devops-incident-agent" ]; then
            pytest -q
          else
            python -m unittest -v
          fi

  terraform-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Check Terraform formatting
        run: |
          terraform fmt -recursive projects/aws-encrypted-backup-lab
          terraform fmt -recursive projects/azure-aks-platform-lab
          git diff --exit-code -- projects/aws-encrypted-backup-lab projects/azure-aks-platform-lab
