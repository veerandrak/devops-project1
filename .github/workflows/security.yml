name: Security Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q             projects/ai-devops-incident-agent/app             projects/kubernetes-sre-lab/app.py             projects/aws-encrypted-backup-lab/backup.py             projects/releaseguard/releaseguard.py             projects/rotation-rehearsal/rotation.py
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check "bandit>=1.7,<2"
      - name: Bandit security scan
        run: |
          bandit -q -r projects/ai-devops-incident-agent/app
          bandit -q projects/aws-encrypted-backup-lab/backup.py
          bandit -q projects/releaseguard/releaseguard.py
          bandit -q projects/rotation-rehearsal/rotation.py
