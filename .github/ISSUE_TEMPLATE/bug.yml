name: Bug report
description: Report reproducible incorrect behavior in a portfolio project
title: "fix: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Please keep secrets, credentials and private infrastructure details out of public issues."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or synthetic input needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, test output or screenshots. Do not include secrets.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - AI DevOps Incident Agent
        - ReleaseGuard
        - Rotation Rehearsal
        - Kubernetes Reliability Lab
        - AWS Encrypted Backup Lab
        - Azure AKS Platform Lab
        - Portfolio / CI
    validations:
      required: true
